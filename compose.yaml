# The ingestion secret is shared between the two services through the environment here. A real
# deployment would hand each one its own copy from a secret store: compose is a demo, not a pattern to
# copy.
x-ingest-secret: &ingest-secret "local-development-ingestion-secret"

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pitchwire
      POSTGRES_PASSWORD: pitchwire
      POSTGRES_DB: pitchwire
    ports:
      - "5432:5432"
    # postgres:18 refuses to start when the volume is mounted at /var/lib/postgresql/data, which is
    # where every older tutorial puts it. Mount the parent directory instead.
    volumes:
      - pitchwire-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwire -d pitchwire"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Pitchwire.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=pitchwire;Username=pitchwire;Password=pitchwire"
      Ingest__Secret: *ingest-secret
      Ingest__FeedBaseAddress: "http://feed:8080/"
      # Applies migrations and puts the league in place on start. Off by default everywhere else.
      Seed__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The runtime image ships with neither curl nor wget, so a healthcheck written with either of
      # them never passes. Bash and /dev/tcp are both already there.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  feed:
    build:
      context: .
      dockerfile: src/Pitchwire.Feed/Dockerfile
    environment:
      Feed__Secret: *ingest-secret
      Feed__ApiBaseAddress: "http://api:8080/"
      # A match minute every half second, so a full match takes about three quarters of a minute and a
      # round finishes while somebody is still looking at it.
      Feed__ClockFactor: "120"
      Feed__RoundIntervalSeconds: "15"
    ports:
      - "5081:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: src/Pitchwire.Web/Dockerfile
    ports:
      - "5082:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost. Inside the container localhost resolves to ::1 first, nginx
      # listens on IPv4 only, and the check fails against a server that is running perfectly well.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pitchwire-db:
