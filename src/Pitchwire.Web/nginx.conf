# The browser-facing API gets a per-client limit before requests reach ASP.NET. Do not key this on
# X-Forwarded-For: callers can supply that header themselves. The public entry point is nginx.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    limit_req_status 429;

    # nginx does not know this extension, so without the mapping the manifest is served as
    # application/octet-stream and a browser refuses it. The application then quietly stops being
    # installable, with nothing anywhere saying why.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Everything under /api reaches the service, so the browser only ever talks to one origin. No
    # CORS to configure, and the device cookie behaves the way a cookie is supposed to.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=public_api burst=25 nodelay;
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace a supplied forwarding chain, rather than passing a caller's claim downstream.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The hub needs the upgrade. A proxy that drops it turns a socket into a confusing series of
        # failed requests rather than an error anybody can read.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Hashed assets never change under the same name, so they can be kept for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single page application: any address the router owns has to arrive as the index, or a reload
    # on a match page answers 404.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
