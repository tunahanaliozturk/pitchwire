name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Whitespace and style only. Analyzer-level style is already enforced by EnforceCodeStyleInBuild
      # with warnings as errors, so running the full formatter here would build a second workspace for
      # no benefit.
      - name: Verify formatting
        run: |
          dotnet format whitespace --verify-no-changes --no-restore
          dotnet format style --verify-no-changes --no-restore

      # Reads the licence terms of every package in the tree, at every depth, from the restored packages
      # on disk. A dependency carrying a fee or a field-of-use restriction fails the build instead of
      # arriving quietly.
      - name: Audit dependency licences
        run: dotnet run --project tools/Pitchwire.LicenseAudit --configuration Release --no-build -- .

      - name: Unit tests
        run: dotnet run --project tests/Pitchwire.UnitTests --configuration Release --no-build

  integration:
    name: integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Testcontainers starts a real PostgreSQL against the Docker daemon on the runner. The guarantee
      # under test is a unique index refusing a second insert, and a provider that does not enforce
      # indexes would only prove that the provider was configured.
      - name: Integration tests
        run: dotnet run --project tests/Pitchwire.IntegrationTests --configuration Release

  compose:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The quick start in the documentation is a promise to whoever clones this. This job keeps it,
      # and it asserts that a match actually played rather than that four containers started.
      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Wait for a match to finish
        run: |
          for attempt in $(seq 1 60); do
            finished=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select count(*) from matches where status = 'Finished'" | tr -d '\r')
            if [ "${finished:-0}" -gt 0 ]; then
              echo "A match finished after about $((attempt * 5)) seconds."
              exit 0
            fi
            sleep 5
          done
          echo "No match finished. The stack came up, and nothing was ingested."
          docker compose logs --tail 50 api feed
          exit 1

      - name: Assert the finished match holds a real event log
        run: |
          row=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select count(*), min(minute), max(minute) from match_events where match_id = (select id from matches where status = 'Finished' limit 1)" | tr -d '\r')
          events=$(echo "$row" | cut -d'|' -f1)
          first=$(echo "$row" | cut -d'|' -f2)
          last=$(echo "$row" | cut -d'|' -f3)
          echo "The finished match holds $events events, running from minute $first to minute $last."
          test "${events:-0}" -gt 5
          test "${first:-99}" -eq 0
          test "${last:-0}" -ge 90

      - name: Assert no match is left showing an incomplete score
        run: |
          degraded=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select count(*) from matches where is_degraded" | tr -d '\r')
          echo "Matches still marked degraded: $degraded"
          test "${degraded:-1}" -eq 0

      - name: Assert the read API serves the table over HTTP
        run: |
          season=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select id from seasons limit 1" | tr -d '[:space:]')
          table=$(curl -fsS "http://localhost:5080/seasons/$season/table")
          echo "$table" | head -c 300
          echo "$table" | grep -q '"position":1'
          live=$(curl -fsS "http://localhost:5080/matches/live?\$top=5")
          echo "$live" | grep -q '"value"'

      - name: Show the table so far
        if: always()
        run: docker compose exec -T postgres psql -U pitchwire -d pitchwire -c "select t.name, s.played, s.won, s.drawn, s.lost, s.points from standings s join teams t on t.id = s.team_id order by s.points desc, s.goals_for desc limit 6"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
