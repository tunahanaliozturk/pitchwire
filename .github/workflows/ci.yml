name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Whitespace and style only. Analyzer-level style is already enforced by EnforceCodeStyleInBuild
      # with warnings as errors, so running the full formatter here would build a second workspace for
      # no benefit.
      - name: Verify formatting
        run: |
          dotnet format whitespace --verify-no-changes --no-restore
          dotnet format style --verify-no-changes --no-restore

      # Reads the licence terms of every package in the tree, at every depth, from the restored packages
      # on disk. A dependency carrying a fee or a field-of-use restriction fails the build instead of
      # arriving quietly.
      - name: Audit dependency licences
        run: dotnet run --project tools/Pitchwire.LicenseAudit --configuration Release --no-build -- .

      - name: Unit tests
        run: dotnet run --project tests/Pitchwire.UnitTests --configuration Release --no-build

  integration:
    name: integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Testcontainers starts a real PostgreSQL against the Docker daemon on the runner. The guarantee
      # under test is a unique index refusing a second insert, and a provider that does not enforce
      # indexes would only prove that the provider was configured.
      - name: Integration tests
        run: dotnet run --project tests/Pitchwire.IntegrationTests --configuration Release

  web:
    name: web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Pitchwire.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Pitchwire.Web/package-lock.json

      - name: Install
        run: npm ci

      # Vite does not type check. Without this job nothing does, and the contract assertions that
      # make a renamed server field break the build would never be evaluated.
      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Formatting belongs to Prettier alone. The lint rules that overlap it are turned off, so this
      # is the only thing that has an opinion about line breaks.
      - name: Verify formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npx vite build

      # What a first visit costs, measured from the build manifest rather than guessed.
      - name: Bundle budget
        run: npm run budget

      # The npm tree gets the same treatment as the NuGet one. PrimeVue 5 moved to a licence with
      # revenue conditions and a licence key, and nothing in a normal install said so.
      - name: Audit dependency licences
        run: npm run licences

  contract:
    name: contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Pitchwire.Web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: src/Pitchwire.Web

      - name: Restore the API
        run: dotnet restore src/Pitchwire.Api/Pitchwire.Api.csproj

      # Takes the document from the running service and regenerates the client types from it. If the
      # committed copies differ, the server has changed shape and nobody told the browser.
      - name: Regenerate the contract
        run: npm run contract
        working-directory: src/Pitchwire.Web

      - name: Fail if the committed contract is out of date
        run: |
          if ! git diff --exit-code -- src/Pitchwire.Web/openapi.json src/Pitchwire.Web/src/api/schema.d.ts; then
            echo "The API has changed shape. Run 'npm run contract' in src/Pitchwire.Web and commit the result."
            exit 1
          fi

  compose:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The quick start in the documentation is a promise to whoever clones this. This job keeps it,
      # and it asserts that a match actually played rather than that four containers started.
      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Wait for a match to finish
        run: |
          for attempt in $(seq 1 60); do
            finished=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select count(*) from matches where status = 'Finished'" | tr -d '\r')
            if [ "${finished:-0}" -gt 0 ]; then
              echo "A match finished after about $((attempt * 5)) seconds."
              exit 0
            fi
            sleep 5
          done
          echo "No match finished. The stack came up, and nothing was ingested."
          docker compose logs --tail 50 api feed
          exit 1

      - name: Assert the finished match holds a real event log
        run: |
          row=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select count(*), min(minute), max(minute) from match_events where match_id = (select id from matches where status = 'Finished' limit 1)" | tr -d '\r')
          events=$(echo "$row" | cut -d'|' -f1)
          first=$(echo "$row" | cut -d'|' -f2)
          last=$(echo "$row" | cut -d'|' -f3)
          echo "The finished match holds $events events, running from minute $first to minute $last."
          test "${events:-0}" -gt 5
          test "${first:-99}" -eq 0
          test "${last:-0}" -ge 90

      - name: Assert no match is left showing an incomplete score
        run: |
          degraded=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select count(*) from matches where is_degraded" | tr -d '\r')
          echo "Matches still marked degraded: $degraded"
          test "${degraded:-1}" -eq 0

      - name: Assert the read API serves the table over HTTP
        run: |
          season=$(docker compose exec -T postgres psql -U pitchwire -d pitchwire -tAc "select id from seasons limit 1" | tr -d '[:space:]')
          table=$(curl -fsS "http://localhost:5080/seasons/$season/table")
          echo "$table" | head -c 300
          echo "$table" | grep -q '"position":1'
          live=$(curl -fsS "http://localhost:5080/matches/live?\$top=5")
          echo "$live" | grep -q '"value"'

      - name: Assert Redis really backs the second cache level
        run: |
          # Redis has no other application use in this stack. A populated table read must put an
          # entry there; merely starting the Redis container does not prove the API uses it.
          entries=$(docker compose exec -T redis redis-cli --raw DBSIZE | tr -d '\r[:space:]')
          echo "Redis keys after the table read: $entries"
          test "${entries:-0}" -gt 0

      - name: Assert the web application is served and can reach the API through it
        run: |
          page=$(curl -fsS http://localhost:5082/)
          echo "$page" | grep -q 'id="app"'
          # A reload on a route the router owns has to arrive as the index rather than a 404.
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:5082/table)" = "200"
          curl -fsS "http://localhost:5082/api/matches/live?\$top=3" | grep -q '"value"'
          # The hub handshake travels the same proxy. A negotiate that answers proves the upgrade is wired.
          curl -fsS -X POST "http://localhost:5082/api/hub/matches/negotiate?negotiateVersion=1" | grep -q WebSockets

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Pitchwire.Web/package-lock.json

      - name: Install browser test dependencies
        run: npm ci
        working-directory: src/Pitchwire.Web

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: src/Pitchwire.Web

      - name: Exercise the browser journeys against the running stack
        run: npm run test:e2e
        working-directory: src/Pitchwire.Web

      - name: Keep the browser trace when a journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-failure
          path: |
            src/Pitchwire.Web/test-results/
            src/Pitchwire.Web/playwright-report/
          retention-days: 7

      - name: Assert the application can be installed and told about a goal
        run: |
          # A manifest served as application/octet-stream is a manifest browsers refuse, and the
          # application quietly stops being installable with nothing saying why.
          docker compose exec -T web wget -qS -O /dev/null http://127.0.0.1:8080/manifest.webmanifest 2>&1 | grep -qi "content-type: application/manifest+json"
          worker=$(curl -fsS http://localhost:5082/sw.js)
          echo "$worker" | grep -q "notificationclick"
          echo "$worker" | grep -q "showNotification"
          # The key a browser needs before it can subscribe at all.
          curl -fsS http://localhost:5082/api/push/public-key | grep -q publicKey

      - name: Assert edge security headers and per-IP throttling
        run: |
          for path in / /api/push/public-key /assets/missing.js; do
            headers=$(curl -sS -D - -o /dev/null "http://localhost:5082$path")
            if [ "$path" = /assets/missing.js ]; then
              echo "$headers" | grep -q '^HTTP/1.1 404'
            else
              echo "$headers" | grep -q '^HTTP/1.1 200'
            fi
            echo "$headers" | grep -qi "^content-security-policy:.*script-src 'self'"
            echo "$headers" | grep -qi '^strict-transport-security: max-age=31536000'
            echo "$headers" | grep -qi '^x-content-type-options: nosniff'
            echo "$headers" | grep -qi '^x-frame-options: DENY'
          done
          # Inventing a different X-Forwarded-For for every request must not escape the limit.
          codes=$(seq 1 80 | xargs -P 16 -I{} curl -s -o /dev/null -w '%{http_code}\n' \
            -H 'X-Forwarded-For: 192.0.2.{}' http://localhost:5082/api/push/public-key)
          echo "$codes" | grep -qx 429

      - name: Show the table so far
        if: always()
        run: docker compose exec -T postgres psql -U pitchwire -d pitchwire -c "select t.name, s.played, s.won, s.drawn, s.lost, s.points from standings s join teams t on t.id = s.team_id order by s.points desc, s.goals_for desc limit 6"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
