name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Whitespace and style only. Analyzer-level style is already enforced by EnforceCodeStyleInBuild
      # with warnings as errors, so running the full formatter here would build a second workspace for
      # no benefit.
      - name: Verify formatting
        run: |
          dotnet format whitespace --verify-no-changes --no-restore
          dotnet format style --verify-no-changes --no-restore

      # Reads the licence terms of every package in the tree, at every depth, from the restored packages
      # on disk. A dependency carrying a fee or a field-of-use restriction fails the build instead of
      # arriving quietly.
      - name: Audit dependency licences
        run: dotnet run --project tools/Pitchwire.LicenseAudit --configuration Release --no-build -- .

      - name: Unit tests
        run: dotnet run --project tests/Pitchwire.UnitTests --configuration Release --no-build

  integration:
    name: integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Testcontainers starts a real PostgreSQL against the Docker daemon on the runner. The guarantee
      # under test is a unique index refusing a second insert, and a provider that does not enforce
      # indexes would only prove that the provider was configured.
      - name: Integration tests
        run: dotnet run --project tests/Pitchwire.IntegrationTests --configuration Release

  compose:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The quick start in the documentation is a promise to whoever clones this. This job is what
      # keeps it, so it asserts the services are actually serving rather than merely started.
      - name: Start the stack
        run: docker compose up -d --wait

      - name: Assert PostgreSQL accepts connections
        run: docker compose exec -T postgres pg_isready -U pitchwire -d pitchwire

      - name: Assert Redis answers
        run: |
          reply=$(docker compose exec -T redis redis-cli ping)
          test "$reply" = "PONG"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
